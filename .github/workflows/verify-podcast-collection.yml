name: Verify podcast collection without publishing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-podcast-collection
  cancel-in-progress: false

jobs:
  verify-collection:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SNAPSHOT_BRANCH: audit-snapshots
      SNAPSHOT_FILE: data/real_podcast_audits.sqlite

    steps:
      - name: Check out pipeline source
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set temporary verification paths
        shell: bash
        run: |
          set -euo pipefail
          printf 'TEMP_DATABASE=%s\nPIPELINE_OUTPUT=%s\n' \
            "$RUNNER_TEMP/podcast-collection-verification.sqlite" \
            "$RUNNER_TEMP/podcast-collection-verification.json" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-input
          -r requirements.txt

      - name: Restore published snapshot into runner temporary storage
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${SNAPSHOT_BRANCH}:refs/remotes/origin/${SNAPSHOT_BRANCH}"
          mapfile -t tracked_files < <(git ls-tree -r --name-only "origin/${SNAPSHOT_BRANCH}")
          if [[ "${#tracked_files[@]}" -ne 1 || "${tracked_files[0]}" != "$SNAPSHOT_FILE" ]]; then
            echo "The published snapshot branch has an unexpected file set; verification stopped."
            exit 1
          fi
          if ! git show "origin/${SNAPSHOT_BRANCH}:${SNAPSHOT_FILE}" > "$TEMP_DATABASE"; then
            echo "The published SQLite snapshot could not be restored; verification stopped."
            exit 1
          fi
          python -c "import sys; from src.published_snapshot import validate_publishable_snapshot; validate_publishable_snapshot(sys.argv[1], allow_recoverable_rss_partial=True)" "$TEMP_DATABASE"
          echo "Published snapshot restored and validated in temporary runner storage."

      - name: Run the real repeat-and-explore collection plan
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python -m src.daily_pipeline --database "$TEMP_DATABASE" \
            --run-id "verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > "$PIPELINE_OUTPUT" \
            2> "$RUNNER_TEMP/podcast-collection-verification-stderr.txt"
          pipeline_exit=$?
          set -e
          python - "$PIPELINE_OUTPUT" "$TEMP_DATABASE" "$pipeline_exit" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import sqlite3
          import sys
          from datetime import datetime
          from pathlib import Path

          output_path, database_path, exit_text = sys.argv[1:]
          try:
              result = json.loads(Path(output_path).read_text(encoding="utf-8"))
              if not isinstance(result, dict):
                  raise ValueError
          except (OSError, UnicodeError, json.JSONDecodeError, ValueError):
              print("Verification failed; sanitized_category=cli_or_runtime.")
              raise SystemExit(1)

          allowed = {"succeeded", "partial", "failed", "skipped", "not_started"}
          status_keys = ("pipeline_status", "collection_status", "validation_status", "persistence_status")
          statuses = {key: result.get(key) for key in status_keys if result.get(key) in allowed}
          report = None
          run_id = result.get("audit_run_id")
          unique_ids = 0
          record_rows = 0
          integrity_ok = False
          metadata_json = None
          if isinstance(run_id, str) and run_id:
              try:
                  with sqlite3.connect(database_path) as connection:
                      integrity_ok = connection.execute("PRAGMA integrity_check").fetchone() == ("ok",)
                      record_rows = connection.execute(
                          "SELECT COUNT(*) FROM podcast_records WHERE audit_run_id = ?",
                          (run_id,),
                      ).fetchone()[0]
                      found = connection.execute(
                          "SELECT COUNT(DISTINCT feed_id) FROM podcast_records WHERE audit_run_id = ?",
                          (run_id,),
                      ).fetchone()
                      unique_ids = int(found[0]) if found else 0
                      metadata_row = connection.execute(
                          "SELECT metadata_json FROM audit_runs WHERE audit_run_id = ?",
                          (run_id,),
                      ).fetchone()
                      metadata_json = metadata_row[0] if metadata_row else None
              except sqlite3.Error:
                  integrity_ok = False
          if isinstance(metadata_json, str):
              try:
                  parsed_metadata = json.loads(metadata_json)
                  if isinstance(parsed_metadata, dict):
                      candidate_report = parsed_metadata.get("collection_report")
                      if isinstance(candidate_report, dict):
                          report = candidate_report
              except json.JSONDecodeError:
                  pass
          diagnostics_available = isinstance(report, dict)
          report = report if diagnostics_available else {}
          sampling = report.get("sampling")
          sampling = sampling if isinstance(sampling, dict) else {}
          lookup = sampling.get("repeat_lookup_outcomes")
          lookup = lookup if isinstance(lookup, dict) else {}
          rss = report.get("rss_outcome_counts")
          rss = rss if isinstance(rss, dict) else {}
          rss_size = report.get("rss_response_size_diagnostics")
          rss_size = rss_size if isinstance(rss_size, dict) else {}
          content_length_status = rss_size.get("declared_content_length_status_counts")
          content_length_status = content_length_status if isinstance(content_length_status, dict) else {}
          content_length_bands = rss_size.get("declared_content_length_size_bands")
          content_length_bands = content_length_bands if isinstance(content_length_bands, dict) else {}
          observed_lower_bound_bands = rss_size.get("size_limit_observed_body_lower_bound_bands")
          observed_lower_bound_bands = observed_lower_bound_bands if isinstance(observed_lower_bound_bands, dict) else {}
          lookup_errors_value = report.get("api_lookup_errors")
          lookup_errors_available = isinstance(lookup_errors_value, list)
          lookup_errors = lookup_errors_value if lookup_errors_available else []
          search_errors_value = report.get("api_search_errors")
          search_errors_available = isinstance(search_errors_value, list)
          search_errors = search_errors_value if search_errors_available else []
          rss_errors_available = isinstance(report.get("rss_errors"), list)
          provenance_value = report.get("record_provenance_by_feed")
          provenance_available = isinstance(provenance_value, dict)
          provenance = provenance_value if provenance_available else {}
          source_counts = {"Apple iTunes Lookup API": 0, "Apple iTunes Search API": 0}
          for item in provenance.values():
              if isinstance(item, dict) and item.get("source") in source_counts:
                  source_counts[item["source"]] += 1
          def read_count(value):
              return value if isinstance(value, int) and not isinstance(value, bool) and value >= 0 else None

          def read_nonnegative_number(value):
              return value if isinstance(value, (int, float)) and not isinstance(value, bool) and value >= 0 else None

          def show_count(value):
              count = read_count(value)
              return str(count) if count is not None else "unavailable"

          def safe_count(value):
              count = read_count(value)
              return count if count is not None else 0

          def show(mapping, key):
              return show_count(mapping.get(key)) if key in mapping else "unavailable"

          sampling_count_fields = (
              "repeat_target", "exploration_target", "repeat_ids_selected_for_lookup",
              "previously_audited_ids_unsupported", "actual_repeat_count", "actual_new_count",
              "repeat_shortfall", "exploration_shortfall", "repeat_lookup_outcome_total",
              "max_records", "record_cap_shortfall",
          )
          lookup_count_fields = (
              "found", "deleted_or_unavailable", "mismatched_result",
              "request_failure", "missing_required_metadata",
          )
          rss_count_fields = (
              "missing_feed_url", "dns_failure", "connection_tls_failure", "http_error",
              "timeout", "response_size_limit", "xml_parsing_failure",
              "successful_parsing", "other_or_unknown_failure",
          )
          report_count_fields = (
              "unique_records_retained", "rss_retrieval_successes", "rss_retrieval_failures",
              "rss_timeout_unattempted_feeds",
              "missing_rss_feed_urls", "rss_attempted_count", "rss_attempt_outcome_total",
              "rss_record_outcome_total", "api_search_calls", "api_lookup_calls",
          )
          rss_timing_fields = (
              "rss_collection_elapsed_seconds", "rss_collection_budget_seconds",
              "rss_request_timeout_seconds",
          )
          content_length_status_fields = ("valid", "missing", "invalid", "unavailable")
          content_length_band_fields = (
              "under_256_kib", "256_kib_to_1_mib", "1_mib_to_2_000_000_bytes",
              "over_2_000_000_bytes", "unknown",
          )
          observed_lower_bound_fields = (
              "over_limit_to_limit_plus_64_kib", "at_least_limit_plus_64_kib", "unavailable",
          )
          rss_size_counts_reconcile = (
              all(read_count(content_length_status.get(key)) is not None for key in content_length_status_fields)
              and all(read_count(content_length_bands.get(key)) is not None for key in content_length_band_fields)
              and all(read_count(observed_lower_bound_bands.get(key)) is not None for key in observed_lower_bound_fields)
              and read_count(rss_size.get("attempt_count")) == safe_count(report.get("rss_attempted_count"))
              and read_count(rss_size.get("limit_bytes")) == 2_000_000
              and read_count(rss_size.get("size_limit_failure_count")) == safe_count(rss.get("response_size_limit"))
              and sum(read_count(content_length_status.get(key)) or 0 for key in content_length_status_fields)
                  == safe_count(report.get("rss_attempted_count"))
              and sum(read_count(content_length_bands.get(key)) or 0 for key in content_length_band_fields)
                  == safe_count(report.get("rss_attempted_count"))
              and sum(read_count(observed_lower_bound_bands.get(key)) or 0 for key in observed_lower_bound_fields)
                  == safe_count(rss.get("response_size_limit"))
          )
          diagnostics_complete = (
              diagnostics_available
              and isinstance(report.get("sampling"), dict)
              and all(read_count(sampling.get(key)) is not None for key in sampling_count_fields)
              and isinstance(report.get("sampling", {}).get("repeat_lookup_outcomes"), dict)
              and all(read_count(lookup.get(key)) is not None for key in lookup_count_fields)
              and isinstance(report.get("rss_outcome_counts"), dict)
              and all(read_count(rss.get(key)) is not None for key in rss_count_fields)
              and all(read_count(report.get(key)) is not None for key in report_count_fields)
              and all(read_nonnegative_number(report.get(key)) is not None for key in rss_timing_fields)
              and isinstance(report.get("rss_collection_timed_out"), bool)
              and lookup_errors_available and search_errors_available and rss_errors_available
              and provenance_available
              and sum(source_counts.values()) == unique_ids
              and sampling.get("repeat_lookup_outcomes_reconcile") is True
              and report.get("rss_attempt_counts_reconcile") is True
              and report.get("rss_record_counts_reconcile") is True
              and rss_size_counts_reconcile
          )

          safe_categories = {
              "dns_failure", "tls_certificate_verification", "tls_connection", "timeout",
              "destination_blocked", "response_size_limit", "redirect_failure",
              "http_status_failure", "invalid_api_response", "malformed_feed",
              "connection_failure", "request_failure",
          }
          def category_counts(errors):
              if not isinstance(errors, list):
                  return "unavailable"
              counts = {}
              for error in errors:
                  category = error.rsplit(":", 1)[-1].strip() if isinstance(error, str) else ""
                  if category not in safe_categories:
                      category = "other_or_unknown_failure"
                  counts[category] = counts.get(category, 0) + 1
              return ", ".join(f"{name}={counts[name]}" for name in sorted(counts)) or "none"

          elapsed = report.get("rss_collection_elapsed_seconds")
          if not isinstance(elapsed, (int, float)) or isinstance(elapsed, bool) or elapsed < 0:
              elapsed = None
          runtime_seconds = None
          try:
              started = datetime.fromisoformat(result["started_at"])
              completed = datetime.fromisoformat(result["completed_at"])
              runtime_seconds = max(0, int((completed - started).total_seconds()))
          except (KeyError, TypeError, ValueError):
              pass
          print("## Controlled podcast collection verification")
          print("- Pipeline: " + statuses.get("pipeline_status", "unknown"))
          print("- Collection: " + statuses.get("collection_status", "unknown"))
          print("- Validation: " + statuses.get("validation_status", "unknown"))
          print("- Persistence to temporary database: " + statuses.get("persistence_status", "unknown"))
          print("- Collection diagnostics: " + ("complete in this audit's SQLite metadata" if diagnostics_complete else "missing or incomplete in this audit's SQLite metadata"))
          print(f"- Repeat target / achieved: {show(sampling, 'repeat_target')} / {show(sampling, 'actual_repeat_count')}")
          print(f"- Exploration target / achieved: {show(sampling, 'exploration_target')} / {show(sampling, 'actual_new_count')}")
          print(f"- Repeat shortfall: {show(sampling, 'repeat_shortfall')}")
          print(f"- Exploration shortfall: {show(sampling, 'exploration_shortfall')}")
          print(f"- Record-cap shortfall: {show(sampling, 'record_cap_shortfall')}")
          print(f"- Repeat lookup outcomes: found={show(lookup, 'found')}; unavailable/deleted={show(lookup, 'deleted_or_unavailable')}; mismatched={show(lookup, 'mismatched_result')}; request failures={show(lookup, 'request_failure')}; missing required metadata={show(lookup, 'missing_required_metadata')}; unsupported saved IDs={show(sampling, 'previously_audited_ids_unsupported')}")
          print("- Repeat lookup request error categories: " + category_counts(lookup_errors if lookup_errors_available else None))
          print("- Exploration search error categories: " + category_counts(search_errors if search_errors_available else None))
          print(f"- Unique IDs persisted for this verification run: {unique_ids}")
          print(f"- Podcast rows persisted for this verification run: {safe_count(record_rows)}")
          if provenance_available:
              print(f"- Source coverage: {source_counts['Apple iTunes Lookup API']} lookup records; {source_counts['Apple iTunes Search API']} search records")
          else:
              print("- Source coverage: unavailable")
          print("- Total pipeline runtime: " + (f"{runtime_seconds} seconds" if runtime_seconds is not None else "unavailable"))
          print(f"- RSS: {show(report, 'rss_retrieval_successes')} parsed; {show(report, 'rss_retrieval_failures')} failed or unattempted; {show(report, 'missing_rss_feed_urls')} missing feed URLs")
          print("- RSS attempt categories: " + ", ".join(
              f"{name}={show(rss, name)}" for name in (
                  "dns_failure", "connection_tls_failure", "http_error", "timeout",
                  "response_size_limit", "xml_parsing_failure", "successful_parsing",
                  "other_or_unknown_failure",
              )
          ))
          if rss_size_counts_reconcile:
              print("- RSS declared Content-Length status (declaration, not verified transfer size): " + ", ".join(
                  f"{name}={content_length_status[name]}" for name in content_length_status_fields
              ))
              print("- RSS declared Content-Length size bands: " + ", ".join(
                  f"{name}={content_length_bands[name]}" for name in content_length_band_fields
              ))
              print(
                  "- RSS size-limit failures / observed callback-body lower-bound bands: "
                  f"{rss_size['size_limit_failure_count']} / "
                  + ", ".join(f"{name}={observed_lower_bound_bands[name]}" for name in observed_lower_bound_fields)
              )
          else:
              print("- RSS response-size diagnostics: unavailable or inconsistent")
          print(f"- RSS stage: {elapsed:.1f} seconds" if elapsed is not None else "- RSS stage: unavailable")
          print("- RSS deadline reached: " + (str(report["rss_collection_timed_out"]) if isinstance(report.get("rss_collection_timed_out"), bool) else "unavailable"))
          print(f"- Temporary SQLite integrity: {'ok' if integrity_ok else 'failed'}")

          lookup_selected = safe_count(sampling.get("repeat_ids_selected_for_lookup"))
          lookup_found = safe_count(lookup.get("found"))
          lookup_outcome_total = sum(safe_count(value) for value in lookup.values())
          lookup_counts_reconcile = (
              lookup_outcome_total == lookup_selected
              and safe_count(sampling.get("repeat_lookup_outcome_total")) == lookup_selected
              and sampling.get("repeat_lookup_outcomes_reconcile") is True
              and lookup_found == safe_count(sampling.get("actual_repeat_count"))
              and safe_count(lookup.get("request_failure")) == len(lookup_errors)
              and safe_count(sampling.get("actual_repeat_count"))
                  + safe_count(sampling.get("actual_new_count")) == unique_ids
              and safe_count(sampling.get("repeat_shortfall")) == max(
                  0, safe_count(sampling.get("repeat_target"))
                  - safe_count(sampling.get("actual_repeat_count"))
              )
              and safe_count(sampling.get("exploration_shortfall")) == max(
                  0, safe_count(sampling.get("exploration_target"))
                  - safe_count(sampling.get("actual_new_count"))
              )
              and safe_count(sampling.get("max_records")) >= unique_ids
              and safe_count(sampling.get("record_cap_shortfall")) == max(
                  0, safe_count(sampling.get("max_records")) - unique_ids
              )
          )
          rss_attempt_categories = (
              "dns_failure", "connection_tls_failure", "http_error", "timeout",
              "response_size_limit", "xml_parsing_failure", "successful_parsing",
              "other_or_unknown_failure",
          )
          rss_counts_reconcile = (
              sum(safe_count(rss.get(name)) for name in rss_attempt_categories)
                  == safe_count(report.get("rss_attempted_count"))
              and safe_count(rss.get("successful_parsing"))
                  == safe_count(report.get("rss_retrieval_successes"))
              and sum(safe_count(rss.get(name)) for name in rss_attempt_categories if name != "successful_parsing")
                  + safe_count(report.get("rss_timeout_unattempted_feeds"))
                  == safe_count(report.get("rss_retrieval_failures"))
              and safe_count(rss.get("missing_feed_url"))
                  == safe_count(report.get("missing_rss_feed_urls"))
              and safe_count(report.get("rss_attempted_count"))
                  + safe_count(report.get("missing_rss_feed_urls"))
                  + safe_count(report.get("rss_timeout_unattempted_feeds")) == unique_ids
              and report.get("rss_attempt_counts_reconcile") is True
              and report.get("rss_record_counts_reconcile") is True
              and safe_count(report.get("rss_attempt_outcome_total"))
                  == safe_count(report.get("rss_attempted_count"))
              and safe_count(report.get("rss_record_outcome_total")) == unique_ids
          )

          try:
              code = int(exit_text)
          except ValueError:
              code = 1
          valid_run = (
              code in {0, 2}
              and statuses.get("pipeline_status") in {"succeeded", "partial"}
              and statuses.get("collection_status") in {"succeeded", "partial"}
              and statuses.get("validation_status") == "succeeded"
              and statuses.get("persistence_status") == "succeeded"
              and unique_ids > 0
              and unique_ids == record_rows
              and unique_ids == safe_count(result.get("records_stored"))
              and unique_ids == safe_count(report.get("unique_records_retained"))
              and diagnostics_complete
              and source_counts["Apple iTunes Lookup API"] == safe_count(sampling.get("actual_repeat_count"))
              and source_counts["Apple iTunes Search API"] == safe_count(sampling.get("actual_new_count"))
              and integrity_ok
              and safe_count(sampling.get("repeat_target")) == 35
              and safe_count(sampling.get("exploration_target")) == 15
              and safe_count(sampling.get("repeat_ids_selected_for_lookup")) == 35
              and safe_count(sampling.get("actual_repeat_count")) > 0
              and safe_count(sampling.get("actual_new_count")) > 0
              and safe_count(report.get("api_search_calls")) == 15
              and safe_count(report.get("api_lookup_calls")) == safe_count(sampling.get("repeat_ids_selected_for_lookup"))
              and not lookup_errors
              and not search_errors
              and lookup_counts_reconcile
              and safe_count(report.get("rss_attempted_count")) > 0
              and safe_count(rss.get("successful_parsing")) > 0
              and rss_counts_reconcile
          )
          if not valid_run:
              print("Verification did not complete all required checks; no snapshot was published.")
              raise SystemExit(1)
          print("Verification completed. The temporary database will be discarded with the runner.")
          PY
