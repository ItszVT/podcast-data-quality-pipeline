
name: Neon PostgreSQL integration tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-postgres-integration-tests
  cancel-in-progress: false

jobs:
  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate test database target
        shell: bash
        env:
          PODCAST_TEST_DATABASE_URL: ${{ secrets.PODCAST_TEST_DATABASE_URL }}
          PODCAST_TEST_EXPECTED_DATABASE: podcast_pipeline_test
          PODCAST_TEST_EXPECTED_USER: podcast_test_runner_v2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ipaddress
          import os
          import re
          from urllib.parse import parse_qsl, unquote, urlsplit

          def fail(message):
              raise SystemExit(message)

          database_url = os.environ.get("PODCAST_TEST_DATABASE_URL", "").strip()

          if not database_url:
              fail(
                  "PODCAST_TEST_DATABASE_URL is missing or empty; "
                  "no connection was attempted."
              )

          try:
              parsed = urlsplit(database_url)
          except ValueError:
              fail(
                  "The PostgreSQL test URL is malformed; "
                  "no connection was attempted."
              )

          if parsed.scheme.lower() not in {"postgres", "postgresql"}:
              fail(
                  "The PostgreSQL test URL has an invalid scheme; "
                  "no connection was attempted."
              )

          try:
              hostname = parsed.hostname or ""
              parsed.port
          except ValueError:
              fail(
                  "The PostgreSQL test URL has an invalid host or port; "
                  "no connection was attempted."
              )

          def valid_hostname(host):
              candidate = host[:-1] if host.endswith(".") else host

              if (
                  not candidate
                  or len(candidate) > 253
                  or any(c.isspace() for c in candidate)
              ):
                  return False

              if re.fullmatch(r"[0-9.]+", candidate):
                  try:
                      ipaddress.ip_address(candidate)
                      return True
                  except ValueError:
                      return False

              try:
                  ipaddress.ip_address(candidate)
                  return True
              except ValueError:
                  labels = candidate.split(".")
                  return all(
                      re.fullmatch(
                          r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?",
                          label
                      )
                      for label in labels
                  )

          if not valid_hostname(hostname):
              fail(
                  "The PostgreSQL test URL has a missing or invalid "
                  "hostname; no connection was attempted."
              )

          try:
              database = unquote(parsed.path.lstrip("/"))
              username = (
                  unquote(parsed.username)
                  if parsed.username is not None
                  else ""
              )

              sslmodes = [
                  value
                  for key, value in parse_qsl(
                      parsed.query,
                      keep_blank_values=True
                  )
                  if key == "sslmode"
              ]

          except (ValueError, UnicodeError):
              fail(
                  "The PostgreSQL test URL is malformed; "
                  "no connection was attempted."
              )

          expected_database = os.environ[
              "PODCAST_TEST_EXPECTED_DATABASE"
          ]

          expected_user = os.environ[
              "PODCAST_TEST_EXPECTED_USER"
          ]

          if (
              not database
              or database != expected_database
              or "test" not in database.casefold()
          ):
              fail(
                  "The PostgreSQL test URL database does not match "
                  "the configured test database."
              )

          if not username or username != expected_user:
              fail(
                  "The PostgreSQL test URL username does not match "
                  "the configured test role."
              )

          if not sslmodes:
              fail(
                  "The PostgreSQL test URL is missing "
                  "sslmode=verify-full."
              )

          if len(sslmodes) != 1:
              fail(
                  "The PostgreSQL test URL must contain exactly "
                  "one sslmode parameter."
              )

          if sslmodes[0] != "verify-full":
              fail(
                  "The PostgreSQL test URL sslmode must be "
                  "verify-full."
              )

          # Pass the validated host to the test fixture.
          # Never print the connection URL or host.
          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as github_env:
              github_env.write(
                  f"PODCAST_TEST_EXPECTED_HOST={hostname.lower()}\n"
              )

          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and PostgreSQL test dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-input
          -r requirements.txt
          -r requirements-postgres.txt

      - name: Diagnose PostgreSQL client and CA trust availability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import psycopg
          import ssl

          paths = ssl.get_default_verify_paths()
          system_bundle = pathlib.Path("/etc/ssl/certs/ca-certificates.crt")
          try:
              ssl.create_default_context(cafile=str(system_bundle))
              system_bundle_loadable = True
          except (OSError, ssl.SSLError):
              system_bundle_loadable = False

          print(f"psycopg_version={psycopg.__version__}")
          print(f"psycopg_pq_implementation={psycopg.pq.__impl__}")
          print(f"libpq_version={psycopg.pq.version()}")
          print(f"libpq_build_version={getattr(psycopg.pq, '__build_version__', 'unavailable')}")
          print(f"system_ca_bundle_available={system_bundle.is_file() and system_bundle.stat().st_size > 0}")
          print(f"system_ca_bundle_loadable_by_python_ssl={system_bundle_loadable}")
          print(f"python_ssl_default_cafile_available={bool(paths.cafile and os.path.isfile(paths.cafile))}")
          print(f"python_ssl_default_capath_available={bool(paths.capath and os.path.isdir(paths.capath))}")
          print(f"ssl_cert_file_override_configured={bool(os.environ.get('SSL_CERT_FILE'))}")
          print(f"ssl_cert_dir_override_configured={bool(os.environ.get('SSL_CERT_DIR'))}")
          print("postgres_test_sslmode=verify-full")
          print("postgres_test_sslrootcert=system")
          print("tls_error_classification=emitted as a fixed safe category by the test fixture on connection failure")
          PY

      - name: Run isolated PostgreSQL integration tests
        shell: bash
        env:
          PODCAST_TEST_DATABASE_URL: ${{ secrets.PODCAST_TEST_DATABASE_URL }}
          PODCAST_TEST_ALLOW_REMOTE: "1"
          PODCAST_TEST_EXPECTED_DATABASE: podcast_pipeline_test
          PODCAST_TEST_EXPECTED_USER: podcast_test_runner_v2
        run: python -m pytest tests/test_postgres_integration.py -q
